# GeekReel 反向代理示例
# 放到 /etc/nginx/conf.d/geekreel.conf，把 example.com 换成你的域名
# 证书用 certbot 申请后会自动改写这里，或按下面注释自己填

upstream geekreel_app {
    server 127.0.0.1:4780;
    keepalive 32;
}

# HTTP 只做跳转
server {
    listen 80;
    server_name example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 上传大视频：按需调大。太小会在导入素材时 413
    client_max_body_size 512m;
    client_body_timeout 300s;

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 任务进度走 WebSocket
    location /ws {
        proxy_pass http://geekreel_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://geekreel_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 一个视频片段生成要 20–30 秒，整集几十秒到几分钟，别用默认 60s
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # 大文件流式下发不要缓冲，否则拖动进度条会卡
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
